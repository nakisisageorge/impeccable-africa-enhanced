[package]
name = "impeccable-benchmark"
edition = "2021"
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
impeccable-common = { path = "../common" }
impeccable-foundation = { path = "../foundation" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = "2"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "json"] }
tokio = { version = "1", features = ["full", "macros", "rt-multi-thread", "time", "signal"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde", "fast-rng"] }
tracing = "0.1"
criterion = "0.5"
async-trait = "0.1"

[dev-dependencies]
criterion = "0.5"
tempfile = "3"

[[bench]]
name = "benchmark_suite"
harness = false